<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Valentine's Day ❤️</title>
  <style>
    body {
      background: linear-gradient(to bottom right, #ffdde1, #ee9ca7);
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin: 0;
      padding: 50px;
    }
    h1 {
      color: crimson;
      font-size: 3em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.5em;
      color: #333;
      margin-bottom: 30px;
    }
    img {
      max-width: 80%;
      height: auto;
      border: 5px solid white;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    .hearts {
      font-size: 3em;
      margin-top: 20px;
      animation: float 3s infinite alternate;
    }
    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <h1>Happy Valentine's Day, Khushboo! ❤️</h1>
  <p>You make my world brighter every day.</p>
  
  <!-- Replace 'myimage.jpg' with the name of your local image file -->
  <img src="IMG_6233.PNG" alt="Our Valentine Image">
  
  <div class="hearts">💖 💘 💝</div>

  <!-- Background music -->
  <audio autoplay loop>
    <source src="romantic.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
</body>
</html>
