<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Valentine's Day ❤️</title>
  <!-- Import romantic fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom right, #ffdde1, #ee9ca7);
      font-family: 'Dancing Script', cursive;
      text-align: center;
      margin: 0;
      padding: 50px;
      overflow: hidden; /* Prevent scrollbars from falling hearts */
    }
    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3em;
      color: crimson;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.6),
                   0 0 20px rgba(255, 0, 0, 0.4),
                   0 0 30px rgba(255, 0, 0, 0.2);
      animation: glow 2s ease-in-out infinite alternate,
                 fadeIn 2s ease forwards;
      opacity: 0;
    }
    p {
      font-size: 1.5em;
      color: #333;
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.5);
      animation: fadeIn 3s ease forwards;
      opacity: 0;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px rgba(255,0,0,0.6), 0 0 20px rgba(255,0,0,0.4); }
      to   { text-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 40px rgba(255,0,0,0.6); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .valentine-img {
      max-width: 400px;
      height: auto;
      border: 5px solid white;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      margin: 20px auto;
      display: block;
      animation: zoom 6s ease-in-out infinite alternate,
                 fadeIn 4s ease forwards;
      opacity: 0;
      position: relative;
      z-index: 2;
    }
    @keyframes zoom {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    .hearts {
      font-size: 3em;
      margin-top: 20px;
      animation: float 3s infinite alternate,
                 fadeIn 5s ease forwards;
      opacity: 0;
      position: relative;
      z-index: 2;
    }
    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: crimson;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      z-index: 2;
      animation: fadeIn 6s ease forwards;
      opacity: 0;
      font-family: Arial, sans-serif; /* Keep button readable */
    }
    button:hover {
      background-color: darkred;
    }
    /* Falling hearts */
    .falling-heart {
      position: absolute;
      top: -50px;
      font-size: 2em;
      color: crimson;
      animation: fall linear forwards;
      z-index: 1;
      opacity: 0.8;
    }
    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Happy Valentine's Day, Khushboo! ❤️</h1>
  <p>You make my world brighter every day.</p>
  
  <img src="IMG_6233.PNG" alt="Our Valentine Image" class="valentine-img">
  
  <div class="hearts">💖 💘 💝</div>

  <!-- Background music -->
  <audio id="bg-music" loop>
    <source src="romantic.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Play/Pause button -->
  <button onclick="toggleMusic()">Play Music</button>

  <script>
    const music = document.getElementById('bg-music');
    const button = document.querySelector('button');

    function toggleMusic() {
      if (music.paused) {
        music.play();
        button.textContent = "Pause Music";
      } else {
        music.pause();
        button.textContent = "Play Music";
      }
    }

    // Safari fix: start paused
    window.addEventListener('load', () => {
      button.textContent = "Play Music";
    });

    // Falling hearts generator
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('falling-heart');
      heart.textContent = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (3 + Math.random() * 5) + 's';
      document.body.appendChild(heart);

      // Remove heart after animation
      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    // Generate hearts every 500ms
    setInterval(createHeart, 500);
  </script>
</body>
</html>
