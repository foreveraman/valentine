<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day!</title>
    <link rel="stylesheet" href="styles.css">
    <script src="gallery.js" defer></script>
</head>
<body>
    <header>
        <h1>Happy Valentine's Day!</h1>
        <p>Celebrate love with flowers and memories.</p>
    </header>
    <section id="flower-gallery">
        <h2>Flower Gallery</h2>
        <div class="gallery">
            <div class="flower" data-name="Roses">
                <img src="roses.jpg" alt="Roses">
                <p>Roses</p>
            </div>
            <div class="flower" data-name="Tulips">
                <img src="tulips.jpg" alt="Tulips">
                <p>Tulips</p>
            </div>
            <div class="flower" data-name="Sunflowers">
                <img src="sunflowers.jpg" alt="Sunflowers">
                <p>Sunflowers</p>
            </div>
            <div class="flower" data-name="Orchids">
                <img src="orchids.jpg" alt="Orchids">
                <p>Orchids</p>
            </div>
            <div class="flower" data-name="Lilies">
                <img src="lilies.jpg" alt="Lilies">
                <p>Lilies</p>
            </div>
        </div>
    </section>
    <section id="personal-photos">
        <h2>Our Memories</h2>
        <div class="photos">
            <img src="photo1.jpg" alt="Memory 1">
            <img src="photo2.jpg" alt="Memory 2">
            <img src="photo3.jpg" alt="Memory 3">
            <img src="photo4.jpg" alt="Memory 4">
        </div>
    </section>
    <footer>
        <p>&copy; 2026 Forever Yours</p>
    </footer>
</body>
</html>
